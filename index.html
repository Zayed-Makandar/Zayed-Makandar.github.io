<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Search results and link previews read these, not content.json, so edit them here. -->
  <title>Zayed Makandar · AI/ML Engineer</title>
  <meta name="description" content="Zayed Makandar, AI/ML engineer. I build vision, speech and LLM systems that hold up in the real world.">
  <link rel="canonical" href="https://zayedmakandar.com/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://zayedmakandar.com/">
  <meta property="og:title" content="Zayed Makandar · AI/ML Engineer">
  <meta property="og:description" content="AI/ML engineer building vision, speech and LLM systems that hold up in the real world.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F3EFE6">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Pick the theme before the first paint so there's no flash. -->
  <script>
    (function () {
      var root = document.documentElement;
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      root.dataset.theme = theme;
      root.classList.add('js');
    })();
  </script>

  <!-- Fonts are self-hosted (see the top of css/style.css); preload the two the first screen needs. -->
  <link rel="preload" href="assets/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">

  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="site-header__inner wrap">
      <nav class="nav" aria-label="Sections">
        <a href="#work" data-text="work.label"></a>
        <a href="#skills" class="nav__keep" data-text="skills.label"></a>
        <a href="#projects" class="nav__keep" data-text="projects.label"></a>
        <a href="#gallery" data-text="gallery.label" data-gallery-link></a>
        <a href="#contact" class="nav__keep" data-text="contact.label"></a>
      </nav>
      <button class="theme-toggle" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="main">
    <section class="hero wrap" id="top">
      <p class="sr-only" data-slot="status"></p>
      <div class="hero__title">
        <h1 class="hero__name" data-slot="name"></h1>
        <span class="sticker" data-slot="sticker" aria-hidden="true" hidden></span>
      </div>
      <p class="hero__tagline" data-rich="hero.tagline"></p>
      <p class="hero__actions" data-slot="hero-buttons"></p>
    </section>

    <section class="section wrap" id="about" aria-labelledby="about-label">
      <h2 class="section__label" id="about-label" data-text="about.label"></h2>
      <div class="section__body about" data-slot="about"></div>
    </section>

    <section class="section wrap" id="work" aria-labelledby="work-label">
      <h2 class="section__label" id="work-label" data-text="work.label"></h2>
      <ul class="section__body jobs" data-slot="work"></ul>
    </section>

    <section class="marquee" aria-labelledby="roles-label">
      <h2 class="sr-only" id="roles-label" data-text="roles.label"></h2>
      <ul class="sr-only" data-slot="roles-list"></ul>
      <!-- Three moving strips: caption, roles, caption. data-direction -1 runs the opposite way. -->
      <div class="marquee__row marquee__row--caption" aria-hidden="true" data-direction="-1" data-speed="0.6">
        <div class="marquee__track"></div>
      </div>
      <div class="marquee__row marquee__row--roles" aria-hidden="true">
        <div class="marquee__track" data-slot="roles"></div>
      </div>
      <div class="marquee__row marquee__row--caption" aria-hidden="true" data-direction="-1" data-speed="0.6" data-offset="0.5">
        <div class="marquee__track"></div>
      </div>
    </section>

    <section class="section wrap" id="skills" aria-labelledby="skills-label">
      <h2 class="section__label" id="skills-label" data-text="skills.label"></h2>
      <ul class="section__body skills" data-slot="skills"></ul>
    </section>

    <section class="section wrap" id="projects" aria-labelledby="projects-label">
      <h2 class="section__label" id="projects-label" data-text="projects.label"></h2>
      <ul class="section__body projects" data-slot="projects"></ul>
    </section>

    <section class="gallery-section" id="gallery" aria-labelledby="gallery-label" hidden>
      <div class="section section--head wrap">
        <h2 class="section__label" id="gallery-label" data-text="gallery.label"></h2>
        <p class="section__body gallery-hint" data-slot="gallery-hint"></p>
      </div>
      <div class="gallery" data-lenis-prevent-horizontal tabindex="0" role="region" aria-labelledby="gallery-label">
        <ul class="gallery__track" data-slot="gallery"></ul>
      </div>
    </section>

    <section class="section wrap contact" id="contact" aria-labelledby="contact-label">
      <h2 class="section__label" id="contact-label" data-text="contact.label"></h2>
      <div class="section__body">
        <p class="contact__heading" data-rich="contact.heading" data-reveal="words"></p>
        <p class="contact__email-row" data-reveal="fade">
          <a class="contact__email" data-slot="email"></a>
          <button class="copy-btn" type="button" data-text="ui.copy"></button>
        </p>
        <ul class="contact__links" data-slot="contact-links" data-reveal="fade"></ul>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer__inner wrap">
      <div class="footer__top">
        <div class="footer__intro">
          <p class="footer__status" data-slot="footer-status" hidden></p>
          <p class="footer__meta">
            <span data-text="footer.location"></span><br>
            <span data-text="footer.timeLabel"></span> <span class="footer__clock" data-slot="clock"></span>
          </p>
        </div>
        <nav class="footer__col" aria-labelledby="footer-sitemap">
          <h2 class="footer__label" id="footer-sitemap" data-text="footer.sitemapLabel"></h2>
          <ul class="footer__list">
            <li><a href="#work" data-text="work.label"></a></li>
            <li><a href="#skills" data-text="skills.label"></a></li>
            <li><a href="#projects" data-text="projects.label"></a></li>
            <li data-gallery-link><a href="#gallery" data-text="gallery.label"></a></li>
            <li><a href="#contact" data-text="contact.label"></a></li>
          </ul>
        </nav>
        <div class="footer__col">
          <h2 class="footer__label" id="footer-elsewhere" data-text="footer.elsewhereLabel"></h2>
          <ul class="footer__list" data-slot="footer-links" aria-labelledby="footer-elsewhere"></ul>
        </div>
      </div>
      <div class="footer__bottom">
        <span data-slot="copyright"></span>
        <a href="#top" data-text="ui.backToTop"></a>
      </div>
    </div>
    <!-- Giant name across the bottom; decorative, so hidden from screen readers. -->
    <p class="footer__wordmark" aria-hidden="true"><span class="footer__wordmark-inner" data-slot="wordmark"></span></p>
  </footer>

  <dialog class="lightbox">
    <div class="lightbox__bar">
      <span class="lightbox__count"></span>
      <button class="lightbox__btn lightbox__close" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>
    <div class="lightbox__stage">
      <img class="lightbox__img" alt="" decoding="async">
    </div>
    <div class="lightbox__bar lightbox__bar--bottom">
      <button class="lightbox__btn lightbox__prev" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <p class="lightbox__caption" aria-live="polite"></p>
      <button class="lightbox__btn lightbox__next" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </dialog>
</body>
</html>
