  <!-- Pick the theme before the first paint so there's no flash. -->
  <script>
    (function () {
      var root = document.documentElement;
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      root.dataset.theme = theme;
      root.classList.add('js');
    })();
  </script>

  <header class="site-header">

      <p class="hero__actions" data-slot="hero-buttons"></p>
    </section>

    <section class="section wrap" id="about" aria-labelledby="about-label">
      <h2 class="section__label" id="about-label" data-text="about.label"></h2>
      <div class="section__body about" data-slot="about"></div>
    </section>

      <h2 class="section__label" id="work-label" data-text="work.label"></h2>

    </section>

    <section class="marquee" aria-labelledby="roles-label">
      <h2 class="sr-only" id="roles-label" data-text="roles.label"></h2>
      <ul class="sr-only" data-slot="roles-list"></ul>
      <!-- Three moving strips: caption, roles, caption. data-direction -1 runs the opposite way. -->
      <div class="marquee__row marquee__row--caption" aria-hidden="true" data-direction="-1" data-speed="0.6">
        <div class="marquee__track"></div>
      </div>
      <div class="marquee__row marquee__row--roles" aria-hidden="true">
        <div class="marquee__track" data-slot="roles"></div>
      </div>
      <div class="marquee__row marquee__row--caption" aria-hidden="true" data-direction="-1" data-speed="0.6" data-offset="0.5">
        <div class="marquee__track"></div>
      </div>
    </section>

    <section class="section wrap" id="skills" aria-labelledby="skills-label">
      <h2 class="section__label" id="skills-label" data-text="skills.label"></h2>
      <ul class="section__body skills" data-slot="skills"></ul>
    </section>

    <section class="section wrap" id="projects" aria-labelledby="projects-label">
      <h2 class="section__label" id="projects-label" data-text="projects.label"></h2>

        </p>
        <ul class="contact__links" data-slot="contact-links" data-reveal="fade"></ul>
      </div>
    </section>
